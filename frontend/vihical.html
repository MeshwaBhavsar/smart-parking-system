
<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/product-theme.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservation Details</title>

    <link rel="stylesheet" href="css/vehical.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">

            <a href="reservation.html">

                <i class="bi bi-arrow-left"></i>

            </a>

            <h2>Reservation Details</h2>

        </div>

        <!-- Parking Details -->

        <div class="info-box">

            <label>Parking Name</label>

            <input
        type="text"
        id="parkingName"
        readonly>

        </div>

        <div class="info-box">

            <label>Area</label>

            <input
        type="text"
        id="parkingArea"
        readonly>

        </div>

        <div class="info-box">

            <label>Address</label>

            <input
        type="text"
        id="parkingAddress"
        readonly>

        </div>

        <div class="info-box">

            <label>Selected Slot</label>

            <input
        type="text"
        id="slotNumber"
        readonly>

        </div>

        <div class="info-box">

            <label>Price</label>

            <input
        type="text"
        id="price"
        readonly>

        </div>

        <!-- User Input -->

        <div class="info-box">

            <label>Vehicle Number</label>

            <input
                type="text"
                id="vehicle"
                placeholder="Enter Vehicle Number">

        </div>

        <div class="info-box">

            <label>Vehicle Type</label>

            <div class="radio-group">

                <label>
                  <input
                        type="radio"
                        name="vehicle"
                        value="Car"
                        checked> 

                        Car
                </label>

                <label>

                    <input
                        type="radio"
                        name="vehicle"
                        value="Bike">

                    Bike

                </label>

                <label>

                    <input
                            type="radio"
                            name="vehicle"
                            value="EV">

                    EV

                </label>

            </div>

        </div>

        <div class="info-box">

            <label>Booking Date</label>

            <input
        type="text"
        id="bookingDate"
        readonly>

        </div>



           

       
        <button onclick="goDashboard()">

            Cancle

            
        </button>

        <button type="button" onclick="nextPage()">

            Next

        </button>

    </div>

</div>

<script src="js/details.js"></script>

</body>

</html>
