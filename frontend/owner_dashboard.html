<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/owner_dashboard.css">

</head>

<body>

<div class="wrapper">

    <!-- ================= Sidebar ================= -->

    <div class="sidebar">

        <div class="logo">

            <div class="logo-icon bi bi-shield-lock-fill">

            

            </div>

            <span>Owner DASHBOARD</span>

        </div>

        <ul class="menu">

            <li class="active">

                <a href="owner_dashboard.html" id="deshboardlink">

                    <i class="bi bi-house-door"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="owner_parking.html" id="reservation">

                    <i class="bi bi-geo-alt-fill"></i>

                    Parking Area 

                </a>

            </li>

            <li>

                <a href="owner_slot.html">

                    <i class="bi bi-p-circle-fill"></i>

                    Parking slot 

                </a>

            </li>

            <li>

                <a href="owner_reservation.html">

                    <i class="bi bi-calendar-check"></i>

                    Reservations 

                </a>

            </li>

            <li>

                <a href="owner_payment.html">

                    <i class="bi bi-credit-card"></i>

                    Payment

                </a>

            </li>

            

            


            <li class="logout">

                <a href="login.html" onclick="logout(); return false;">

                    <i class="bi bi-box-arrow-left"></i>

                    Logout

                </a>

            </li>

        </ul>

    </div>



    <!-- ================= Main ================= -->

    <div class="main">

        <!-- Navbar -->

        <nav class="top-navbar">

            <button class="menu-btn">

                <i class="bi bi-list"></i>

            </button>
 
            <h5 class="m-0 fw-bold">

                Dashboard

            </h5>
          

            <div class="right-menu">

                <i class="bi bi-bell"></i>

                <div class="user">

                    <span>Hello, Owner</span>

                   

                </div>

            </div>

        </nav>


        <div id="main-content">

        <div class="dashboard">


    <h1>
        Owner Dashboard
    </h1>


    <h2>
        Welcome,
        <span id="ownerName">
            Owner
        </span>
        👋
    </h2>


    <!-- ========================= -->
    <!-- DASHBOARD CARDS -->
    <!-- ========================= -->

    <div class="cards">


        <div class="card">

            <h3>
                Total Parkings
            </h3>

            <p id="totalParkings">
                0
            </p>

        </div>


        <div class="card">

            <h3>
                Total Slots
            </h3>

            <p id="totalSlots">
                0
            </p>

        </div>


        <div class="card">

            <h3>
                Available Slots
            </h3>

            <p id="availableSlots">
                0
            </p>

        </div>


        <div class="card">

            <h3>
                Occupied Slots
            </h3>

            <p id="occupiedSlots">
                0
            </p>

        </div>


        <div class="card">

            <h3>
                Total Reservations
            </h3>

            <p id="totalReservations">
                0
            </p>

        </div>


        <div class="card">

            <h3>
                Total Revenue
            </h3>

            <p>
                ₹<span id="totalRevenue">
                    0
                </span>
            </p>

        </div>


    </div>


</div>


<script
    src="js/owner_dashboard.js"
></script>

<script src="js/login.js"></script>


</body>

</html>
