<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/smart-alert.css">
    <script src="js/smart-alert.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Parking | Smart Parking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/owner-standalone.css">

</head>

<body class="owner-form-page">

<main class="parking-form-shell">
    <a class="parking-form-back" href="owner_parking.html">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        Back to parking management
    </a>

    <section class="parking-form-card" aria-labelledby="parkingFormTitle">
        <header class="parking-form-header">
            <span class="form-eyebrow">Facility setup</span>
            <h1 id="parkingFormTitle">Add Parking</h1>
            <p>Add the facility details, map coordinates, capacity, and hourly price shown across your owner workspace.</p>
        </header>

        <form id="parkingForm" onsubmit="addParking(event)">
            <div class="parking-field full-width">
                <label for="parking_name">Parking Name <span aria-hidden="true">*</span></label>
                <input type="text" id="parking_name" placeholder="e.g. Central Plaza Parking">
            </div>

            <div class="parking-field">
                <label for="area">Area <span aria-hidden="true">*</span></label>
                <input type="text" id="area" placeholder="Enter locality or area">
            </div>

            <div class="parking-field">
                <label for="city">City <span aria-hidden="true">*</span></label>
                <input type="text" id="city" placeholder="Enter city">
            </div>

            <div class="parking-field full-width">
                <label for="address">Complete Address <span aria-hidden="true">*</span></label>
                <input type="text" id="address" placeholder="Street, landmark, and postal details">
            </div>

            <div class="parking-field">
                <label for="latitude">Latitude <span aria-hidden="true">*</span></label>
                <input type="number" step="any" id="latitude" placeholder="e.g. 19.0760">
                <small class="field-hint">Use the precise map coordinate for accurate location.</small>
            </div>

            <div class="parking-field">
                <label for="longitude">Longitude <span aria-hidden="true">*</span></label>
                <input type="number" step="any" id="longitude" placeholder="e.g. 72.8777">
                <small class="field-hint">Use the precise map coordinate for accurate location.</small>
            </div>

            <div class="parking-field">
                <label for="total_slots">Total Slots <span aria-hidden="true">*</span></label>
                <input type="number" id="total_slots" placeholder="Enter total capacity">
            </div>

            <div class="parking-field">
                <label for="price">Price per Hour <span aria-hidden="true">*</span></label>
                <input type="number" id="price" placeholder="Enter amount in ₹">
            </div>

            <div class="parking-form-actions">
                <a href="owner_parking.html">Cancel</a>
                <button type="submit">
                    <i class="bi bi-check2-circle" aria-hidden="true"></i>
                    Save Parking
                </button>
            </div>
        </form>
    </section>
</main>

<script src="js/owner_add_parking.js"></script>
<script>
    if (new URLSearchParams(window.location.search).get("id")) {
        document.getElementById("parkingFormTitle").textContent = "Edit Parking";
        document.title = "Edit Parking | Smart Parking";
    }
</script>
</body>
</html>
