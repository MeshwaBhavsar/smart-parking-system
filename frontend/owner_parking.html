<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="admincss/admin-parking.css">

</head>

<body>

<div class="wrapper">

    <!-- ================= Sidebar ================= -->

    <div class="sidebar">

        <div class="logo">

            <div class="logo-icon bi bi-shield-lock-fill">

            

            </div>

            <span>Owner DASHBOARD</span>

        </div>

        <ul class="menu">

            <li>

                <a href="owner_dashboard.html" >

                    <i class="bi bi-house-door"></i>

                    Dashboard

                </a>

            </li>


            <li class="active">

                <a href="owner_parking.html" id="deshboardlink">

                    <i class="bi bi-geo-alt-fill"></i>

                    Parking Area 

                </a>

            </li>

            <li>

                <a href="owner_slot.html">

                    <i class="bi bi-p-circle-fill"></i>

                    Parking slot 

                </a>

            </li>

            <li>

                <a href="owner_reservation.html">

                    <i class="bi bi-calendar-check"></i>

                    Reservations 

                </a>

            </li>

            <li>

                <a href="owner_payment.html">

                    <i class="bi bi-credit-card"></i>

                    Payment

                </a>

            </li>


             <li class="logout">

                <a href="login.html" onclick="logout(); return false;">

                    <i class="bi bi-box-arrow-left"></i>

                    Logout

                </a>

            </li>

        </ul>

    </div>



    <!-- ================= Main ================= -->

    <div class="main">

        <!-- Navbar -->

        <nav class="top-navbar">

            <button class="menu-btn">

                <i class="bi bi-list"></i>

            </button>
 
            <h5 class="m-0 fw-bold">

                Dashboard

            </h5>
          

            <div class="right-menu">

                <i class="bi bi-bell"></i>

                <div class="user">

                    <span>Hello, Owner</span>

                   

                </div>

            </div>

        </nav>
<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="fw-bold">

            <i class="bi bi-p-circle-fill text-success"></i>

            Manage Parking

        </h2>

        <button class="btn btn-success" ><a href="owner_add_parking.html">

            <i class="bi bi-plus-circle"></i>

            Add Parking

        </a></button>

    </div>

    <!-- Search -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <div class="row">

                <div class="col-md-8">

                    <input
                    id="searchParking"
                    type="text"
                    class="form-control"
                    placeholder="Search Parking By Id or Area">

                </div>

                <div class="col-md-4">

                    <button class="btn btn-success w-100" onclick="searchParking()">

                        <i class="bi bi-search"></i>

                        Search

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Parking Table -->

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-success">

                        <tr>

                            <th>ID</th>

                            <th>Parking Name</th>

                            <th>area</th>
                            <th>city</th>

                            <th>Address</th>

                            <th>Total Slots</th>

                            <th>Available</th>

                            <th>Occupied</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="parkingTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
<script src="js/parking.js"></script>
<script src="js/login.js"></script>

</body>

</html>
