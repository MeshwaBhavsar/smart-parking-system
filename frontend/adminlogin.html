<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/product-theme.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="admincss/admin-login.css">

</head>
<link rel="stylesheet" href="css/product-ui.css">
<script src="js/ui.js" defer></script>

<body>

<div class="login-container">

    <!-- Left Side -->

    <div class="left-panel">

        <div class="logo">

            <i class="bi bi-p-circle-fill"></i>

            <h2>SMART PARKING</h2>

            <p>Management System</p>

        </div>

        <div class="welcome">

            <h1>Welcome Back Admin!</h1>

            <p>

                Login to manage parking areas, slots,
                users, reservations and payments.

            </p>

        </div>

    </div>

    <!-- Right Side -->

    <div class="right-panel">

        <div class="login-box">

            <div class="icon">

                <i class="bi bi-shield-lock-fill"></i>

            </div>

            <h2>Admin Login</h2>

            <p>Please login to continue</p>

            <form id="adminLoginForm">

    <div class="mb-3">

        <label>Email Address</label>

        <div class="input-group">

            <span class="input-group-text">
                <i class="bi bi-envelope"></i>
            </span>

            <input
                type="email"
                id="adminEmail"
                class="form-control"
                placeholder="Enter Email"
                required>

        </div>

    </div>


    <div class="mb-3">

        <label>Password</label>

        <div class="input-group">

            <span class="input-group-text">
                <i class="bi bi-lock"></i>
            </span>

            <input
                type="password"
                id="adminPassword"
                class="form-control"
                placeholder="Enter Password"
                required>

        </div>

    </div>


    <div class="d-flex justify-content-between mb-4">

        <div>

            <input type="checkbox">

            Remember Me

        </div>

        <a href="admin_forgot_pass.html">
            Forgot Password?
        </a>

    </div>


    <button
        type="submit"
        class="btn btn-success w-100 login-btn">

        <i class="bi bi-box-arrow-in-right"></i>

        Login

    </button>

</form>
<script src="js/admin_login.js"></script>
</body>
</html>
