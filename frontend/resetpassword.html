<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/smart-alert.css">
    <script src="js/smart-alert.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:350px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:darkgreen;
        }

        a{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <input
        type="password"
        id="new_password"
        placeholder="New Password">

    <input
        type="password"
        id="confirm_password"
        placeholder="Confirm Password">

    <button onclick="resetPassword()">
        Update Password
    </button>

    <a href="login.html">
        Back to Login
    </a>

</div>

<script src="js/reset.js"></script>

</body>
</html>
