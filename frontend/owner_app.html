<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Become a Parking Owner</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="mb-2">
                        Become a Parking Owner
                    </h2>

                    <p class="text-muted">
                        Submit your parking details.
                        Our admin team will review your
                        application.
                    </p>

                    <form
                        id="ownerApplicationForm"
                        onsubmit="submitOwnerApplication(event)"
                    >

                        <!-- Owner Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Owner Name
                            </label>

                            <input
                                type="text"
                                id="owner_name"
                                class="form-control"
                                required>

                        </div>


                        <!-- Business -->

                        <div class="mb-3">

                            <label class="form-label">
                                Business / Company Name
                            </label>

                            <input
                                type="text"
                                id="business_name"
                                class="form-control"
                                required>

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                required>

                        </div>

                        <!-- Password -->
<div class="mb-3">

    <label class="form-label">
        Password
    </label>

    <input
        type="password"
        id="password"
        class="form-control"
        minlength="8"
        required
        placeholder="Enter password">

</div>


<!-- Confirm Password -->
<div class="mb-3">

    <label class="form-label">
        Confirm Password
    </label>

    <input
        type="password"
        id="confirm_password"
        class="form-control"
        minlength="8"
        required
        placeholder="Confirm password">

</div>


                        <!-- Phone -->

                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                class="form-control"
                                required>

                        </div>



                        <!-- Parking Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Parking Name
                            </label>

                            <input
                                type="text"
                                id="parking_name"
                                class="form-control"
                                required>

                        </div>


                        <!-- Address -->

                        <div class="mb-3">

                            <label class="form-label">
                                Parking Address
                            </label>

                            <textarea
                                id="address"
                                class="form-control"
                                rows="3"
                                required>
                            </textarea>

                        </div>


                        <div class="row">

                            <!-- City -->

                            <div class="col-md-4 mb-3">

                                <label class="form-label">
                                    City
                                </label>

                                <input
                                    type="text"
                                    id="city"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- State -->

                            <div class="col-md-4 mb-3">

                                <label class="form-label">
                                    State
                                </label>

                                <input
                                    type="text"
                                    id="state"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- Pincode -->

                            <div class="col-md-4 mb-3">

                                <label class="form-label">
                                    Pincode
                                </label>

                                <input
                                    type="text"
                                    id="pincode"
                                    class="form-control"
                                    required>

                            </div>

                        </div>


                        <!-- Slots -->

                        <div class="mb-4">

                            <label class="form-label">
                                Total Parking Slots
                            </label>

                            <input
                                type="number"
                                id="total_slots"
                                class="form-control"
                                min="1"
                                required>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Submit Application

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="js/owner_app.js"></script>

</body>

</html>
