<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/smart-alert.css">
    <script src="js/smart-alert.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="admincss/admindash.css">
    <link rel="stylesheet" href="admincss/admin-nav.css">

</head>

<body>

<div class="wrapper">

    <!-- ================= Sidebar ================= -->

    <div class="sidebar">

        <div class="logo">

            <div class="logo-icon bi bi-shield-lock-fill">

            

            </div>

            <span>ADMIN DASHBOARD</span>

        </div>

        <ul class="menu">

            <li class="active">

                <a href="admindashboard.html" id="deshboardlink">

                    <i class="bi bi-house-door"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="admin_owner_app.html">

                    <i class="bi bi-credit-card"></i>

                    owner application

                </a>

            </li>

            <li>

                <a href="adminuser.html" id="live parking">

                    <i class="bi bi-people-fill"></i>

                    Users 

                </a>

            </li>

            <li>

                <a href="adminparking.html" id="reservation">

                    <i class="bi bi-geo-alt-fill"></i>

                    Parking Area 

                </a>

            </li>

            <li>

                <a href="adminslot.html">

                    <i class="bi bi-p-circle-fill"></i>

                    Parking slot 

                </a>

            </li>

            <li>

                <a href="admin_reservation.html">

                    <i class="bi bi-calendar-check"></i>

                    Reservations 

                </a>

            </li>

            <li>

                <a href="adminpayment.html">

                    <i class="bi bi-credit-card"></i>

                    Payment

                </a>

            </li>

            <li>

                <a href="admincontact.html">

                    <i class="bi bi-envelope-fill"></i>

                    Contact

                </a>

            </li>

            


            <li class="logout">

                <a href="adminlogin.html" onclick="logout(); return false;">

                    <i class="bi bi-box-arrow-left"></i>

                    Logout

                </a>

            </li>

        </ul>

    </div>



    <!-- ================= Main ================= -->

    <div class="main">

        <!-- Navbar -->

        <nav class="top-navbar">

            <button class="menu-btn">

                <i class="bi bi-list"></i>

            </button>
 
            <h5 class="m-0 fw-bold">

                Dashboard

            </h5>
          

            <div class="right-menu">

                <i class="bi bi-bell"></i>

                <div class="user">

                    <span>Hello, Admin</span>

                   

                </div>

            </div>

        </nav>


        <div id="main-content">

        <div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="mb-2">
                        Add Parking Owner
                    </h2>

                    <p class="text-muted">
                        Create a new parking owner account
                    </p>


                    <form
                        id="ownerForm"
                        onsubmit="createOwner(event)"
                    >

                        <!-- Full Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="full_name"
                                class="form-control"
                                placeholder="Enter full name"
                                required>

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter email"
                                required>

                        </div>


                        <!-- Phone -->

                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                class="form-control"
                                placeholder="Enter phone number"
                                required>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Enter password"
                                required>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Create Owner

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="js/add_owner.js"></script>
<script src="js/login.js"></script>

</body>

</html>
