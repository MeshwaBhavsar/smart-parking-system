<html lang="en">

<head>
    <link rel="stylesheet" href="css/smart-alert.css">
    <script src="js/smart-alert.js"></script>
    <link rel="stylesheet" href="css/product-theme.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">



    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">



    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/user-pages-responsive.css">

</head>

<body class="user-portal-page profile-page">

<div class="wrapper">


    <div class="sidebar">

        <div class="logo">

            <div class="logo-icon">

                P

            </div>

            <span>SMART PARKING</span>

        </div>

        <ul class="menu">

            <li>

                <a href="dashboard.html" id="deshboardlink">

                    <i class="bi bi-house-door"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="liveparking.html" id="live parking">

                    <i class="bi bi-car-front"></i>

                    Live Parking 

                </a>

            </li>

            <li>

                <a href="reservation.html" id="reservation">

                    <i class="bi bi-calendar-check"></i>

                    Reservation 

                </a>

            </li>

            <li>

                <a href="history.html">

                    <i class="bi bi-list-ul"></i>

                    History

                </a>

            </li>

            <li>

                <a href="payment.html">

                    <i class="bi bi-credit-card"></i>

                    Payment

                </a>

            </li>


            <li>
                <a href="myvehi.html">

                    <i class="bi bi-car-front-fill"></i>

                    My Vehicales

                </a>

            </li>

            <li class="active">

                <a href="profile.html">

                    <i class="bi bi-person"></i>

                    Profile

                </a>

            </li>

            <li class="logout">

                <a href="login.html" onclick="logout(); return false;">

                    <i class="bi bi-box-arrow-left"></i>

                    Logout

                </a>

            </li>

        </ul>

    </div>



   

    <div class="main">

     

        <nav class="top-navbar">

            <button class="menu-btn">

                <i class="bi bi-list"></i>

            </button>
 
            <h5 class="m-0 fw-bold">

                Dashboard

            </h5>
          

            <div class="right-menu">

                <i class="bi bi-bell"></i>

    <div class="user">

        <span id="helloUser">Hello, User</span>

    </div>
            </div>
        </nav>


        <div id="main-content">
        <div class="container-fluid py-4">


            <div class="profile-container">


                <!-- ========================================= -->
                <!-- PROFILE HEADER -->
                <!-- ========================================= -->

                <div class="profile-header">

                    <h2>

                        <i class="bi bi-person-circle"></i>

                        My Profile

                    </h2>

                    <p>

                        Manage your personal information

                    </p>

                </div>



                <!-- ========================================= -->
                <!-- PROFILE CARD -->
                <!-- ========================================= -->

                <div class="profile-card">


                    <!-- ===================================== -->
                    <!-- PHOTO SECTION -->
                    <!-- ===================================== -->

                    <div class="photo-section">


                        <div class="photo-wrapper">


                            <img
                                id="previewImage"
                                src="images/default-profile.png"
                                alt="Profile Photo"
                                class="profile-image"
                            >


                        </div>


                        <!-- Hidden file input -->

                        <input
                            type="file"
                            id="profileImage"
                            accept="image/png,image/jpeg,image/jpg,image/webp"
                            hidden
                        >


                        <button
                            type="button"
                            id="changePhotoBtn"
                            class="btn btn-outline-primary"
                        >

                            <i class="bi bi-camera"></i>

                            Change Photo

                        </button>


                        <small class="text-muted">

                            JPG, PNG or WEBP

                        </small>


                    </div>



                    <!-- ===================================== -->
                    <!-- FORM -->
                    <!-- ===================================== -->

                    <div class="profile-form">


                        <!-- FULL NAME -->

                        <div class="form-group">

                            <label for="full_name">

                                Full Name

                            </label>


                            <input
                                type="text"
                                id="full_name"
                                class="form-control"
                                placeholder="Full Name"
                                readonly
                            >

                        </div>



                        <!-- EMAIL -->

                        <div class="form-group">

                            <label for="email">

                                Email

                            </label>


                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Email"
                                readonly
                            >

                        </div>



                        <!-- PHONE -->

                        <div class="form-group">

                            <label for="phone">

                                Contact Number

                            </label>


                            <input
                                type="text"
                                id="phone"
                                class="form-control"
                                placeholder="Enter contact number"
                            >

                        </div>



                        <!-- GENDER -->

                        <div class="form-group">

                            <label for="gender">

                                Gender

                            </label>


                            <select
                                id="gender"
                                class="form-control"
                            >

                                <option value="">
                                    Select Gender
                                </option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>



                        <!-- CITY -->

                        <div class="form-group">

                            <label for="city">

                                City

                            </label>


                            <input
                                type="text"
                                id="city"
                                class="form-control"
                                placeholder="Enter city"
                            >

                        </div>



                        <!-- ADDRESS -->

                        <div class="form-group full-width">

                            <label for="address">

                                Address

                            </label>


                            <textarea
                                id="address"
                                class="form-control"
                                rows="4"
                                placeholder="Enter your address"
                            ></textarea>

                        </div>



                        <!-- BUTTON -->

                        <div class="button-section">

                            <button
                                type="button"
                                id="saveBtn"
                                class="btn btn-primary"
                            >

                                <i class="bi bi-check-circle"></i>

                                Save Changes

                            </button>

                        </div>


                    </div>

                </div>


            </div>

        </div>


    </div>

</div>



<!-- ================================================= -->
<!-- JAVASCRIPT -->
<!-- ================================================= -->

<script src="js/navbar.js"></script>
<script src="js/profile.js"></script>
<script src="js/login.js"></script>


</body>

</html>
