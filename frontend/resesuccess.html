<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/smart-alert.css">
    <script src="js/smart-alert.js"></script>
    <link rel="stylesheet" href="css/product-theme.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservation Successful</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/resersuc.css">

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-lg border-0 rounded-4 mt-5">

                <div class="card-body text-center p-5">

                    <!-- Success Icon -->

                    <div class="success-icon">

                        <i class="bi bi-check-circle-fill"></i>

                    </div>

                    <h2 class="mt-3 text-success fw-bold">

                        Reservation Successful

                    </h2>

                    <p class="text-muted">

                        Your parking slot has been reserved successfully.

                    </p>

                    <hr>

                    <!-- Reservation Details -->

                    <div class="row text-start mt-4">

                        <div class="col-6">

                            <strong>Reservation ID</strong>

                        </div>

                        <div class="col-6 text-end">

                            SP20260001

                        </div>

                    </div>

                    <div class="row mt-3 text-start">

                        <div class="col-6">

                            <strong>Parking Name</strong>

                        </div>

                        <div class="col-6 text-end">

                            Alpha Parking

                        </div>

                    </div>

                    <div class="row mt-3 text-start">

                        <div class="col-6">

                            <strong>Slot Number</strong>

                        </div>

                        <div class="col-6 text-end">

                            A-15

                        </div>

                    </div>

                    <div class="row mt-3 text-start">

                        <div class="col-6">

                            <strong>Vehicle Number</strong>

                        </div>

                        <div class="col-6 text-end">

                            GJ01AB1234

                        </div>

                    </div>

                    <div class="row mt-3 text-start">

                        <div class="col-6">

                            <strong>Date</strong>

                        </div>

                        <div class="col-6 text-end">

                            21 July 2026

                        </div>

                    </div>

                    <div class="row mt-3 text-start">

                        <div class="col-6">

                            <strong>Time</strong>

                        </div>

                        <div class="col-6 text-end">

                            10:30 AM

                        </div>

                    </div>

                    <hr class="my-4">

                    <div class="d-grid gap-3">

                        <a href="Qr.html" class="btn btn-success btn-lg">

                            <i class="bi bi-qr-code"></i>

                            View QR Code

                        </a>

                        <a href="dashboard.html" class="btn btn-outline-secondary">

                            <i class="bi bi-house"></i>

                            Back to Dashboard

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
