<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/smart-alert.css">
    <script src="js/smart-alert.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/owner_payment.css">

</head>

<body>

<div class="wrapper">

    <!-- ================= Sidebar ================= -->

    <div class="sidebar">

        <div class="logo">

            <div class="logo-icon bi bi-shield-lock-fill">

            

            </div>

            <span>Owner DASHBOARD</span>

        </div>

        <ul class="menu">

            <li >

                <a href="owner_dashboard.html">

                    <i class="bi bi-house-door"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="owner_parking.html" id="reservation">

                    <i class="bi bi-geo-alt-fill"></i>

                    Parking Area 

                </a>

            </li>

            <li>

                <a href="owner_slot.html">

                    <i class="bi bi-p-circle-fill"></i>

                    Parking slot 

                </a>

            </li>

            <li>

                <a href="owner_reservation.html">

                    <i class="bi bi-calendar-check"></i>

                    Reservations 

                </a>

            </li>

            <li class="active">

                <a href="owner_payment.html" id="deshboardlink">

                    <i class="bi bi-credit-card"></i>

                    Payment

                </a>

            </li>

            

            


            <li class="logout">

                <a href="login.html" onclick="logout(); return false;">

                    <i class="bi bi-box-arrow-left"></i>

                    Logout

                </a>

            </li>

        </ul>

    </div>



    <!-- ================= Main ================= -->

    <div class="main">

        <!-- Navbar -->

        <nav class="top-navbar">

            <button class="menu-btn">

                <i class="bi bi-list"></i>

            </button>
 
            <h5 class="m-0 fw-bold">

                Dashboard

            </h5>
          

            <div class="right-menu">

                <i class="bi bi-bell"></i>

                <div class="user">

                    <span>Hello, Owner</span>

                   

                </div>

            </div>

        </nav>


        <div id="main-content">
        <br>
        <br>

        <h1>Payment Management</h1>


<div class="table-container">

    <table>

        <thead>

            <tr>

                <th>ID</th>

                <th>User ID</th>

                <th>Reservation ID</th>

                <th>Amount</th>

                <th>Payment Method</th>

                <th>Payment Status</th>

                <th>Action</th>

            </tr>

        </thead>


        <tbody
            id="paymentTableBody"
        >

            <tr>

                <td
                    colspan="7"
                    class="loading"
                >
                    Loading payments...
                </td>

            </tr>

        </tbody>

    </table>

</div>



<!-- =====================================
     PAYMENT DETAILS MODAL
===================================== -->

<div
    id="paymentModal"
    class="payment-modal"
>


    <div class="payment-modal-content">


        <!-- HEADER -->

        <div class="modal-header">

            <h2>
                Payment Details
            </h2>


            <button
                class="modal-close"
                onclick="closePaymentModal()"
            >

                &times;

            </button>

        </div>


        <!-- DETAILS -->

        <div
            id="paymentDetails"
            class="payment-details"
        >

            <p>
                Loading...
            </p>

        </div>


    </div>

</div>



<script
    src="js/owner_payment.js"
></script>

<script src="js/login.js"></script>

</body>

</html>
