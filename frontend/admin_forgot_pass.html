<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/smart-alert.css">
    <script src="js/smart-alert.js"></script>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Forgot Password - Smart Parking</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #f1f5f9;

            font-family: Arial, sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .forgot-container {

            width: 450px;

            max-width: 90%;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.10);

        }


        .icon {

            width: 80px;

            height: 80px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #d1fae5;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #198754;

            font-size: 35px;

        }


        h2 {

            text-align: center;

            font-weight: 700;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;

        }


        .input-group-text {

            background: #198754;

            color: white;

            border: none;

            width: 45px;

            justify-content: center;

        }


        .form-control {

            height: 48px;

        }


        .btn-reset {

            height: 48px;

            font-weight: 600;

        }


        .back-login {

            text-align: center;

            margin-top: 20px;

        }


        .back-login a {

            color: #198754;

            text-decoration: none;

            font-weight: 600;

        }


        .back-login a:hover {

            text-decoration: underline;

        }


        #message {

            display: none;

            margin-top: 15px;

        }

    </style>

</head>


<body>


    <div class="forgot-container">


        <!-- Icon -->

        <div class="icon">

            <i class="bi bi-shield-lock-fill"></i>

        </div>


        <!-- Heading -->

        <h2>Forgot Password?</h2>

        <p class="subtitle">

            Reset your admin account password

        </p>


        <!-- Form -->

        <form id="resetPasswordForm">


            <!-- Email -->

            <div class="mb-3">

                <label
                    for="resetEmail"
                    class="form-label">

                    Admin Email Address

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-envelope"></i>

                    </span>


                    <input
                        type="email"
                        id="resetEmail"
                        class="form-control"
                        placeholder="Enter admin email"
                        required>

                </div>

            </div>



            <!-- New Password -->

            <div class="mb-3">

                <label
                    for="newPassword"
                    class="form-label">

                    New Password

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>


                    <input
                        type="password"
                        id="newPassword"
                        class="form-control"
                        placeholder="Enter new password"
                        minlength="6"
                        required>

                </div>

            </div>



            <!-- Confirm Password -->

            <div class="mb-4">

                <label
                    for="confirmPassword"
                    class="form-label">

                    Confirm New Password

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock-fill"></i>

                    </span>


                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm new password"
                        minlength="6"
                        required>

                </div>

            </div>



            <!-- Reset Button -->

            <button
                type="submit"
                class="btn btn-success w-100 btn-reset">

                <i class="bi bi-check-circle"></i>

                Change Password

            </button>


        </form>



        <!-- Message -->

        <div
            id="message"
            class="alert"
            role="alert">

        </div>



        <!-- Back to Login -->

        <div class="back-login">

            <a href="admin-login.html">

                <i class="bi bi-arrow-left"></i>

                Back to Admin Login

            </a>

        </div>


    </div>


    <!-- JavaScript -->

    <script src="js/admin_forget_pass.js"></script>


</body>

</html>
