        </ul>

    </div>



    <!-- ================= Main ================= -->

    <div class="main">

        <!-- Navbar -->

        <nav class="top-navbar">

            <button class="menu-btn">

                <i class="bi bi-list"></i>

            </button>
 
            <h5 class="m-0 fw-bold">

                Dashboard

            </h5>
          

            <div class="right-menu">

                <i class="bi bi-bell"></i>

    <div class="user">

        <span id="helloUser">Hello, User</span>

    </div>
            </div>
        </nav>


        <div id="main-content">
           
            <div class="container py-4">

    <!-- Header -->

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">

        <div>

            <h2>
                🚗 My Vehicles
            </h2>

            <p class="text-muted">

                Manage your vehicles
                for parking reservations.

            </p>

        </div>


        <button
            class="btn btn-primary"
            onclick="openAddVehicle()"
        >

            + Add Vehicle

        </button>

    </div>


    <!-- Vehicle count -->

    <div class="mb-3">

        <strong>

            <span id="vehicleCount">
                0
            </span>

            Vehicles

        </strong>

    </div>


    <!-- Vehicle list -->

    <div
        id="vehicleContainer"
        class="row g-4"
    >

        <div class="text-center">

            Loading vehicles...

        </div>

    </div>

</div>


<!-- ================================= -->
<!-- ADD / EDIT MODAL -->
<!-- ================================= -->

<div
    class="modal fade"
    id="vehicleModal"
    tabindex="-1"
>

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalTitle"
                >
                    Add Vehicle
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <div class="modal-body">

                <input
                    type="hidden"
                    id="vehicleId"
                >


                <div class="mb-3">

                    <label class="form-label">

                        Vehicle Number

                    </label>

                    <input
                        type="text"
                        id="vehicleNumber"
                        class="form-control"
                        placeholder="GJ01AB1234"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">

                        Vehicle Type

                    </label>

                    <select
                        id="vehicleType"
                        class="form-select"
                    >

                        <option value="">
                            Select Vehicle Type
                        </option>

                        <option value="Car">
                            🚗 Car
                        </option>

                        <option value="Bike">
                            🏍️ Bike
                        </option>

                        <option value="Scooter">
                            🛵 Scooter
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >

                    Cancel

                </button>


                <button
                    class="btn btn-primary"
                    onclick="saveVehicle()"
                >

                    Save Vehicle

                </button>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script src="js/navbar.js"></script>
<script src="js/myvehi.js"></script>
<script src="js/login.js"></script>
