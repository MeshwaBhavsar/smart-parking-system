<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/product-theme.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entry Successful</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/entry.css">

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body text-center p-5">

                    <!-- Success Icon -->

                    <div class="success-icon">

                        <i class="bi bi-check-circle-fill"></i>

                    </div>

                    <h2 class="text-success fw-bold mt-4">

                        Entry Successful

                    </h2>

                    <p class="text-muted">

                        Welcome! Your parking session has started.

                    </p>

                    <hr>

                    <!-- Details -->

                    <div class="parking-details">

                        <div class="detail-item">

                            <span>Slot</span>

                            <strong>A-15</strong>

                        </div>

                        <div class="detail-item">

                            <span>Status</span>

                            <strong class="text-success">

                                Parking Started

                            </strong>

                        </div>

                        <div class="detail-item">

                            <span>Timer</span>

                            <strong id="timer">

                                00:00:00

                            </strong>

                        </div>

                    </div>

                    <hr>

                    <a href="active-parking.html" class="btn btn-success btn-lg w-100">

                        <i class="bi bi-car-front-fill"></i>

                        Go to Active Parking

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

// Live Timer

let seconds = 0;

function updateTimer(){

    seconds++;

    let hrs = String(Math.floor(seconds / 3600)).padStart(2,'0');

    let mins = String(Math.floor((seconds % 3600)/60)).padStart(2,'0');

    let secs = String(seconds % 60).padStart(2,'0');

    document.getElementById("timer").innerHTML =
        hrs + ":" + mins + ":" + secs;

}

setInterval(updateTimer,1000);

</script>

</body>

</html>
