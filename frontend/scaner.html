<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/smart-alert.css">
    <script src="js/smart-alert.js"></script>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff QR Scanner</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!--  <link rel="stylesheet"
          href="css/staff-scanner.css">  -->
          <style>
            body {

    background: #f5f7fa;

    font-family: Arial, sans-serif;

}


.scanner-container {

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 100vh;

}


.scanner-card {

    width: 450px;

    padding: 30px;

    background: white;

    border-radius: 15px;

    text-align: center;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.12);

}


.scanner-card h2 {

    margin-bottom: 10px;

}


#reader {

    width: 100%;

    margin-top: 25px;

}


.result {

    margin-top: 20px;

    padding: 15px;

    border-radius: 8px;

    background: #f1f1f1;

}
            </style>

</head>

<body>

<div class="scanner-container">

    <div class="scanner-card">

        <h2>Parking Staff Scanner</h2>

        <p>
            Scan customer's parking QR code
        </p>

        <!-- Scanner -->

        <div id="reader"></div>

        <!-- Result -->

        <div id="result"
             class="result">

            Waiting for QR scan...

        </div>

        <input
    type="file"
    id="qrImage"
    accept="image/*"
>

    </div>

</div>


<!-- QR Scanner Library -->

<script src="https://unpkg.com/html5-qrcode"></script>

<!-- Your JS -->

<script src="js/scanner.js"></script>

</body>

</html>
