body {

/* Main Page */

.success-page {

/* Card */

/* Success Icon */

    border-radius: 50%;

    align-items: center;
    justify-content: center;
}

.success-icon i {
    font-size: 50px;
    color: #16a34a;
}


/* Heading */

.success-message {

    margin-bottom: 25px;
}


/* Details */

.details-box {

    border-radius: 12px;

    padding: 5px 20px;
}


.detail-row {

.detail-row:last-child {

}

/* Amount */

/* Alert */

/* Buttons */

    padding: 12px;

    <script>

document.addEventListener("DOMContentLoaded", async function () {

    // -----------------------------------------
    // Get payment and reservation information
    // -----------------------------------------

    const paymentId =
        sessionStorage.getItem("payment_id");

    const reservationId =
        sessionStorage.getItem("reservation_id");

    // -----------------------------------------
    // Display Payment ID
    // -----------------------------------------

    document.getElementById("paymentId").textContent =
        paymentId || "--";

    // -----------------------------------------
    // Display Reservation ID
    // -----------------------------------------

    document.getElementById("reservationId").textContent =
        reservationId || "--";


    // -----------------------------------------
    // Check reservation ID
    // -----------------------------------------

    if (!reservationId) {

        console.error("Reservation ID not found.");

        document.getElementById("parkingName").textContent =
            "--";

        document.getElementById("amountPaid").textContent =
            "₹0";

        return;
    }


    // -----------------------------------------
    // Get JWT token
    // -----------------------------------------

    const token =
        sessionStorage.getItem("access_token");


    if (!token) {

        console.error("Access token not found.");

        return;
    }


    // -----------------------------------------
    // Fetch reservation details
    // -----------------------------------------

    try {

        const response = await fetch(
            `https://smart-parking-system-tz4z.onrender.com/reservation/${reservationId}`,
            {
                method: "GET",

                headers: {
                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );


        if (!response.ok) {

            throw new Error(
                `Failed to fetch reservation: ${response.status}`
            );

        }


        const reservation =
            await response.json();


        console.log(
            "Reservation details:",
            reservation
        );


        // -----------------------------------------
        // Parking Name
        // -----------------------------------------

        document.getElementById("parkingName").textContent =
            reservation.parking_name || "--";


        // -----------------------------------------
        // Amount Paid
        // -----------------------------------------

        const amount =
            reservation.total_amount;


        if (
            amount !== null &&
            amount !== undefined
        ) {

            document.getElementById(
                "amountPaid"
            ).textContent =
                "₹" + Number(amount).toFixed(2);

        } else {

            document.getElementById(
                "amountPaid"
            ).textContent =
                "₹0";

        }


    } catch (error) {

        console.error(
            "Error loading reservation details:",
            error
        );

        document.getElementById(
            "parkingName"
        ).textContent = "--";

        document.getElementById(
            "amountPaid"
        ).textContent = "₹0";

    }

});


// -----------------------------------------
// Go Home
// -----------------------------------------

function goHome() {

    window.location.href = "dashboard.html";

}

</script>
