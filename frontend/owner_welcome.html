<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/smart-alert.css">
    <script src="js/smart-alert.js"></script>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Owner Welcome</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container">

    <div
        class="row justify-content-center align-items-center"
        style="min-height: 100vh;"
    >

        <div class="col-md-7">

            <div class="card shadow-lg border-0">

                <div class="card-body text-center p-5">

                    <div
                        class="mb-4"
                        style="font-size: 60px;"
                    >
                        🎉
                    </div>

                    <h1 class="text-success mb-3">
                        Application Approved!
                    </h1>

                    <h3 class="mb-3">
                        Welcome, <span id="ownerName"></span>!
                    </h3>

                    <p class="text-muted fs-5">

                        Your parking owner application has been
                        approved by the administrator.

                    </p>

                    <p class="text-muted">

                        You can now manage your parking,
                        parking slots and bookings from
                        your owner dashboard.

                    </p>

                    <button
                        class="btn btn-success btn-lg px-5 mt-3"
                        onclick="goToOwnerDashboard()"
                    >

                        Go to Owner Dashboard

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    // Get owner information
    const userData =
        sessionStorage.getItem("user");


    if (!userData) {

        // User is not logged in
        window.location.href = "login.html";

    }


    const user =
        JSON.parse(userData);


    // Display owner name
    document.getElementById(
        "ownerName"
    ).textContent =
        user.full_name;


    function goToOwnerDashboard() {

        window.location.href =
            "owner_dashboard.html";

    }

</script>

</body>

</html>
