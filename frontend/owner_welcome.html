<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/smart-alert.css">
    <script src="js/smart-alert.js"></script>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Owner Welcome</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/owner-standalone.css">

</head>

<body class="owner-welcome-page">

<main class="welcome-shell">
    <section class="welcome-card" aria-labelledby="welcomeTitle">
        <div class="welcome-icon bi bi-check-lg" aria-hidden="true"></div>
        <span class="form-eyebrow">Application approved</span>
        <h1 id="welcomeTitle">Welcome to Smart Parking</h1>
        <h2>You're all set, <span id="ownerName"></span>!</h2>
        <p>Your parking owner application has been approved by the administrator.</p>
        <p class="welcome-detail">You can now manage your facilities, parking slots, bookings, and payment activity from your owner dashboard.</p>
        <button onclick="goToOwnerDashboard()">
            Open Owner Dashboard
            <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </button>
    </section>
</main>


<script>

    // Get owner information
    const userData =
        sessionStorage.getItem("user");


    if (!userData) {

        // User is not logged in
        window.location.href = "login.html";

    }


    const user =
        JSON.parse(userData);


    // Display owner name
    document.getElementById(
        "ownerName"
    ).textContent =
        user.full_name;


    function goToOwnerDashboard() {

        window.location.href =
            "owner_dashboard.html";

    }

</script>

</body>

</html>
